<div class="forgot-container">

  <div class="forgot-card">

    <h1>
      Recuperar contraseña
    </h1>

    <p>
      Ingresa tu correo electrónico
    </p>

    <input
      type="email"
      placeholder="Correo electrónico"
      [(ngModel)]="correo"
    >

    <button
      (click)="enviarCorreo()"
    >
      Enviar correo
    </button>

    <p class="mensaje">
      {{ mensaje }}
    </p>

    <a routerLink="/login">
      Volver al login
    </a>

  </div>

</div>
