<div class="login-container">

  <div class="login-card">

    <h1>Nueva contraseña</h1>

    <input
      type="password"
      placeholder="Ingresa tu nueva contraseña"
      [ngModel]="nuevaContrasena()"
      (ngModelChange)="nuevaContrasena.set($event)"
    >

    <button (click)="cambiarPassword()">
      Guardar contraseña
    </button>

    <p [class.error]="esError()" [class.success]="!esError()">
  {{ mensaje() }}
</p>

  </div>

</div>
