<div class="checkout-card">
  <h3>Resumen del pedido</h3>

  @if (carrito().length === 0) {
    <p>Tu carrito está vacío.</p>
  } @else {

    @for (producto of carrito(); track $index) {
      <div class="product-row">
        <span>{{ producto.nombre }}</span>
        <span>{{ producto.precio | currency:'MXN' }}</span>
      </div>
    }

    <hr>

    <div class="total-row">
      <span>Total:</span>
      <strong>{{ total() | currency:'MXN' }}</strong>
    </div>

    <!-- IMPORTANTE: contenedor limpio -->
    <div #paypalButtonContainer></div>
  }

  @if (mensaje) {
    <p class="status-message">{{ mensaje }}</p>
  }
</div>
